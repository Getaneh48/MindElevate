
`yaml
version: 2
updates:

Keep GitHub Actions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

Flask backend (Python)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Group all dev/test dependencies together
      dev-deps:
        patterns:
          - "pytest*"
          - "flake8"
          - "black"
      # Group all Flask-related packages together
      flask-stack:
        patterns:
          - "flask*"
          - "werkzeug"
          - "jinja2"

React frontend (npm)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    groups:
      # Group all devDependencies together
      dev-deps:
        dependency-type: "development"
      # Group React ecosystem packages together
      react-stack:
        patterns:
          - "react*"
          - "react-dom"
          - "react-router*"
      # Group tooling packages together
      tooling:
        patterns:
          - "webpack*"
          - "babel*"
          - "eslint*"
`