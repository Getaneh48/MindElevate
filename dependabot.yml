version: 2
updates:
  # Keep GitHub Actions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    # security_updates: true   # Uncomment if supported

  # Flask backend (Python)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    versioning-strategy: "auto"
    # security_updates: true   # Uncomment if supported
    groups:
      dev-deps:
        patterns:
          - "pytest*"
          - "flake8"
          - "black"
      flask-stack:
        patterns:
          - "flask*"
          - "werkzeug"
          - "jinja2"

  # React frontend (npm)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"  # changed from daily
    open-pull-requests-limit: 10
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    versioning-strategy: "auto"
    # security_updates: true   # Uncomment if supported
    groups:
      dev-deps:
        dependency-type: "development"
      react-stack:
        patterns:
          - "react*"
          - "react-dom"
          - "react-router*"
      tooling:
        patterns:
          - "webpack*"
          - "babel*"
          - "eslint*"

  # Docker example (add only if you use Dockerfiles)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    allow:
      - dependency-type: "direct"
    versioning-strategy: "auto"
    # security_updates: true   # Uncomment if supported